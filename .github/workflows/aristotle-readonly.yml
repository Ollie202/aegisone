name: Aristotle Read-Only Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/m5-judgeable-slice]
    paths:
      - .github/workflows/aristotle-readonly.yml
      - packages/m5-flow/scripts/pre-mainnet.ts

concurrency:
  group: aristotle-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PROOFRAIL_ARISTOTLE_WALLET_ADDRESS: "0x067Ac9bcb6B640bF65a0b17eeE705859c8292Dbb"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @aegisone/contracts compile
      - name: Run Aristotle read-only gate
        run: node --experimental-strip-types packages/m5-flow/scripts/pre-mainnet.ts
